<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f9f3" />
      <stop offset="55%" stop-color="#ddeddf" />
      <stop offset="100%" stop-color="#c2e0c9" />
    </linearGradient>
    <linearGradient id="goldGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d08c" />
      <stop offset="100%" stop-color="#c99748" />
    </linearGradient>
    <filter id="shadowLight" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1d4a35" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Background rounded squircle (light mint gradient) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradLight)" />

  <!-- Inner glowing frame border -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="rgba(47,107,79,0.16)" stroke-width="4" />

  <!-- Ledger Book Container with Shadow -->
  <g filter="url(#shadowLight)">
    <!-- Book Back Cover -->
    <rect x="110" y="96" width="292" height="320" rx="18" fill="#0d241a" />

    <!-- Ledger Pages (stacked effect) -->
    <rect x="114" y="104" width="284" height="304" rx="14" fill="#ede8dc" />
    <rect x="122" y="108" width="272" height="296" rx="12" fill="#fcfaf5" />

    <!-- Ledger Spine on Left -->
    <path d="M 110 114 A 18 18 0 0 1 128 96 L 158 96 L 158 416 L 128 416 A 18 18 0 0 1 110 398 Z" fill="url(#goldGradLight)" />

    <!-- Spine stitch details -->
    <line x1="140" y1="120" x2="140" y2="392" stroke="#946c2d" stroke-width="2" stroke-dasharray="8 6" />

    <!-- Ledger Ruled Lines on Page -->
    <!-- Red vertical margin line -->
    <line x1="184" y1="130" x2="184" y2="378" stroke="#e07a5f" stroke-width="2.5" opacity="0.8" />

    <!-- Horizontal ledger rows -->
    <line x1="196" y1="168" x2="368" y2="168" stroke="#c4d5cb" stroke-width="3" stroke-linecap="round" />
    <line x1="196" y1="208" x2="368" y2="208" stroke="#c4d5cb" stroke-width="3" stroke-linecap="round" />
    <line x1="196" y1="248" x2="368" y2="248" stroke="#c4d5cb" stroke-width="3" stroke-linecap="round" />
    <line x1="196" y1="288" x2="368" y2="288" stroke="#c4d5cb" stroke-width="3" stroke-linecap="round" />
    <line x1="196" y1="328" x2="340" y2="328" stroke="#c4d5cb" stroke-width="3" stroke-linecap="round" />

    <!-- Ruled row value indicators (Green + / Red - pill badges) -->
    <rect x="312" y="158" width="56" height="18" rx="9" fill="#2d6a4f" />
    <text x="340" y="171" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>

    <rect x="312" y="198" width="56" height="18" rx="9" fill="#c93b2b" />
    <text x="340" y="211" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">−</text>

    <rect x="312" y="238" width="56" height="18" rx="9" fill="#2d6a4f" />
    <text x="340" y="251" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>

    <!-- Silk Bookmark Ribbon hanging from bottom -->
    <path d="M 228 96 L 228 436 L 244 416 L 260 436 L 260 96 Z" fill="#e76f51" />
    <path d="M 228 96 L 244 96 L 244 416 L 228 436 Z" fill="#cf5638" />
  </g>
</svg>
