<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512">

  <defs>

    <!-- Tri-color background: Emerald → Kelly Green → Fresh Green -->
    <linearGradient id="bgGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006B5B"/>
      <stop offset="48%" stop-color="#009B55"/>
      <stop offset="100%" stop-color="#52D83D"/>
    </linearGradient>

    <!-- Background glow -->
    <radialGradient id="bgGlow"
                    cx="72%" cy="18%"
                    r="70%">
      <stop offset="0%" stop-color="#A8FF8A" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#52D83D" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#52D83D" stop-opacity="0"/>
    </radialGradient>

    <!-- Book cover -->
    <linearGradient id="coverGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4938"/>
      <stop offset="100%" stop-color="#09251B"/>
    </linearGradient>

    <!-- Gold spine -->
    <linearGradient id="goldGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B87822"/>
      <stop offset="28%" stop-color="#E7B955"/>
      <stop offset="52%" stop-color="#FFE18A"/>
      <stop offset="78%" stop-color="#D69A35"/>
      <stop offset="100%" stop-color="#A9681D"/>
    </linearGradient>

    <!-- Page -->
    <linearGradient id="pageGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#F3EFE3"/>
    </linearGradient>

    <!-- Bookmark -->
    <linearGradient id="bookmarkGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C84532"/>
      <stop offset="50%" stop-color="#EF7053"/>
      <stop offset="100%" stop-color="#C94A35"/>
    </linearGradient>

    <!-- Positive badge -->
    <linearGradient id="positiveGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16845C"/>
      <stop offset="100%" stop-color="#087045"/>
    </linearGradient>

    <!-- Negative badge -->
    <linearGradient id="negativeGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F05D45"/>
      <stop offset="100%" stop-color="#D63E2D"/>
    </linearGradient>

    <!-- Main shadow -->
    <filter id="bookShadow"
            x="-20%"
            y="-20%"
            width="145%"
            height="155%">
      <feDropShadow
        dx="0"
        dy="14"
        stdDeviation="14"
        flood-color="#002E20"
        flood-opacity="0.42"/>
    </filter>

    <!-- Small shadow -->
    <filter id="softShadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="150%">
      <feDropShadow
        dx="0"
        dy="5"
        stdDeviation="7"
        flood-color="#123326"
        flood-opacity="0.22"/>
    </filter>

    <!-- Gold shine -->
    <linearGradient id="goldHighlight"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

  </defs>


  <!-- =========================
       APP BACKGROUND (full-bleed for maskable)
  ========================== -->

  <rect
    x="0"
    y="0"
    width="512"
    height="512"
    fill="url(#bgGradient)"
  />

  <rect
    x="0"
    y="0"
    width="512"
    height="512"
    fill="url(#bgGlow)"
  />


  <!-- =========================
       LEDGER (scaled into central safe-zone)
  ========================== -->

  <g transform="translate(40, 30) scale(0.85)">

    <g filter="url(#bookShadow)">

      <!-- Dark green back cover -->
      <rect
        x="106"
        y="91"
        width="302"
        height="332"
        rx="22"
        fill="url(#coverGradient)"
      />

      <!-- Cover highlight -->
      <path
        d="M128 92
           H386
           Q408 92 408 114
           V160
           C330 135 230 125 128 140
           Z"
        fill="#FFFFFF"
        opacity="0.045"
      />


      <!-- =====================
           PAGE STACK
      ====================== -->

      <rect
        x="112"
        y="101"
        width="288"
        height="314"
        rx="16"
        fill="#D8D1C2"
      />

      <rect
        x="117"
        y="106"
        width="281"
        height="307"
        rx="15"
        fill="#EEE9DD"
      />

      <rect
        x="123"
        y="111"
        width="270"
        height="294"
        rx="13"
        fill="url(#pageGradient)"
      />


      <!-- =====================
           GOLD SPINE
      ====================== -->

      <path
        d="M106 114
           A22 22 0 0 1 128 92
           H158
           V423
           H128
           A22 22 0 0 1 106 401
           Z"
        fill="url(#goldGradient)"
      />

      <!-- Spine shine -->
      <path
        d="M116 111
           A15 15 0 0 1 131 99
           H143
           V416
           H131
           A15 15 0 0 1 116 401
           Z"
        fill="url(#goldHighlight)"
        opacity="0.55"
      />

      <!-- Spine stitching -->
      <line
        x1="140"
        y1="119"
        x2="140"
        y2="395"
        stroke="#87591C"
        stroke-width="2"
        stroke-linecap="round"
        stroke-dasharray="8 8"
        opacity="0.85"
      />


      <!-- =====================
           PAGE CONTENT
      ====================== -->

      <!-- Red margin -->
      <line
        x1="183"
        y1="132"
        x2="183"
        y2="379"
        stroke="#E85D48"
        stroke-width="3"
        stroke-linecap="round"
      />

      <!-- Ruled lines -->
      <g
        stroke="#BFD4C8"
        stroke-width="3"
        stroke-linecap="round">

        <line x1="197" y1="169" x2="367" y2="169"/>
        <line x1="197" y1="210" x2="367" y2="210"/>
        <line x1="197" y1="251" x2="367" y2="251"/>
        <line x1="197" y1="292" x2="367" y2="292"/>
        <line x1="197" y1="333" x2="350" y2="333"/>
        <line x1="197" y1="374" x2="335" y2="374"/>

      </g>


      <!-- =====================
           ENTRY BADGES
      ====================== -->

      <!-- Plus -->
      <g filter="url(#softShadow)">
        <rect
          x="311"
          y="158"
          width="58"
          height="22"
          rx="11"
          fill="url(#positiveGradient)"
        />

        <text
          x="340"
          y="174"
          text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="15"
          font-weight="800"
          fill="#FFFFFF">
          +
        </text>
      </g>


      <!-- Minus -->
      <g filter="url(#softShadow)">
        <rect
          x="311"
          y="199"
          width="58"
          height="22"
          rx="11"
          fill="url(#negativeGradient)"
        />

        <text
          x="340"
          y="215"
          text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="15"
          font-weight="800"
          fill="#FFFFFF">
          −
        </text>
      </g>


      <!-- Plus -->
      <g filter="url(#softShadow)">
        <rect
          x="311"
          y="240"
          width="58"
          height="22"
          rx="11"
          fill="url(#positiveGradient)"
        />

        <text
          x="340"
          y="256"
          text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="15"
          font-weight="800"
          fill="#FFFFFF">
          +
        </text>
      </g>


      <!-- =====================
           BOOKMARK
      ====================== -->

      <path
        d="M226 92
           H260
           V438
           L243 420
           L226 438
           Z"
        fill="url(#bookmarkGradient)"
      />

      <!-- Bookmark highlight -->
      <path
        d="M228 96
           H243
           V416
           L228 432
           Z"
        fill="#FFFFFF"
        opacity="0.10"
      />

    </g>


    <!-- Ambient shadow -->
    <ellipse
      cx="256"
      cy="447"
      rx="112"
      ry="12"
      fill="#002E20"
      opacity="0.12"
    />

  </g>

</svg>
