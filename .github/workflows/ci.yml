name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run lint
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test-output.log
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build-output.log
      - name: Post output as PR comment or issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### CI failed on ${{ github.event_name == 'pull_request' && 'this PR' || 'main' }} (commit ${{ github.sha }})"
            for f in /tmp/test-output.log /tmp/build-output.log; do
              if [ -f "$f" ]; then
                echo "#### $f"
                echo '```'
                tail -c 30000 "$f"
                echo '```'
              fi
            done
          } > /tmp/comment-body.md
          jq -n --rawfile body /tmp/comment-body.md '{body: $body}' > /tmp/comment-payload.json
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            curl -sS -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              -d @/tmp/comment-payload.json
          else
            jq -n --rawfile body /tmp/comment-body.md --arg title "CI failure on main: unit tests (${{ github.sha }})" '{title: $title, body: $body}' > /tmp/issue-payload.json
            curl -sS -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}/issues" \
              -d @/tmp/issue-payload.json
          fi

  rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Run rules test suite
        id: rules_test
        shell: bash
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee /tmp/rules-output.log
      - name: Post output as PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          {
            echo "### Firestore rules test suite failed"
            echo '```'
            tail -c 60000 /tmp/rules-output.log
            echo '```'
          } > /tmp/comment-body.md
          jq -n --rawfile body /tmp/comment-body.md '{body: $body}' > /tmp/comment-payload.json
          curl -sS -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d @/tmp/comment-payload.json
